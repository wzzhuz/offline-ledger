name: 临时诊断
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置 Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: 跑单测并留日志
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee /tmp/unit.log
          exit 0
      - name: 上传日志
        uses: actions/upload-artifact@v4
        with:
          name: p34-unit-log
          path: /tmp/unit.log
