name: 临时诊断
'on':
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置 Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: 跑单测并留日志
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace --no-daemon > /tmp/unit.log 2>&1
          echo "EXIT=$?" >> /tmp/unit.log
          exit 0
      - name: 回传日志到仓库
        run: |
          python3 - <<'PY'
          import base64, json, urllib.request, os
          data = open('/tmp/unit.log','rb').read()
          payload = {
            "message": "diag: unit log",
            "content": base64.b64encode(data).decode(),
            "branch": "main"
          }
          req = urllib.request.Request(
            "https://api.github.com/repos/" + os.environ['GITHUB_REPOSITORY'] + "/contents/_diag_unit.log",
            data=json.dumps(payload).encode(),
            headers={
              "Authorization": "Bearer " + os.environ['DIAG_TOKEN'],
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "User-Agent": "diag"
            }, method="PUT")
          print(urllib.request.urlopen(req, timeout=120).status)
          PY
        env:
          DIAG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
