name: 临时诊断
'on':
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置 Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: 跑单测并留日志
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee /tmp/unit.log
          echo "GRADLE_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0
      - name: 回传日志到仓库
        run: |
          mkdir -p diag
          cp /tmp/unit.log diag/unit.log
          git config user.email "diag@local"
          git config user.name "diag"
          git add -f diag/unit.log
          git commit -m "diag: unit test log" || true
          git push origin HEAD:refs/heads/main || true
