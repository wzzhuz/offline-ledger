name: 临时诊断2
'on':
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置 Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: 跑单测并把错误摘录写进仓库
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace --no-daemon > /tmp/unit.log 2>&1
          echo "GRADLE_EXIT=$?" >> /tmp/unit.log
          { grep -E '^e: |FAILED|error:|Unresolved|Compilation|expected:|AssertionError|Caused by|FAILURE|Test ' /tmp/unit.log | head -120; echo '=== TAIL ==='; tail -80 /tmp/unit.log; } > /tmp/brief.log
          mkdir -p diag && cp /tmp/brief.log diag/unit.log
          git config user.email diag@local && git config user.name diag
          git add -f diag/unit.log
          git commit -m "chore(diag): 回传第39批单测错误摘录" || true
          git push origin HEAD:main || true
